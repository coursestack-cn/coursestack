name: Deploy Workers

run-name: Deploy production from ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_data:
        description: Replace production D1 and R2 data with the demo data after deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-workers-production
  cancel-in-progress: false

jobs:
  deploy:
    # Remote migrations must already be merged into main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The production GitHub environment holds the Cloudflare secrets and admits only main.
    environment:
      name: production
      url: https://coursestack.cn
    env:
      CI: 'true'
      DEPLOY_ENV: production
      DEPLOY_URL: https://coursestack.cn
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets of the $DEPLOY_ENV GitHub environment."
            exit 1
          fi

      # Ordinary releases always migrate; only an explicit manual input can reset production data.
      - name: Resolve data reset
        env:
          RESET_DATA: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_data && 'true' || 'false' }}
        run: |
          if [[ "$RESET_DATA" != true && "$RESET_DATA" != false ]]; then
            echo "::error::RESET_DATA must be true or false."
            exit 1
          fi
          echo "RESET_DATA=$RESET_DATA" >> "$GITHUB_ENV"
          echo "Reset production data after deploying: $RESET_DATA"

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          working-directory: backend
          runtime: node@24
          install: false
          cache: true
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Prepare database target
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const { env: { production } } = JSON.parse(await readFile('wrangler.json', 'utf8'));
          await mkdir('.local', { recursive: true });
          await writeFile('.local/remote.json', JSON.stringify({
            accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
            databaseId: production.d1_databases[0].database_id,
            bucketName: production.r2_buckets[0].bucket_name,
          }));
          NODE

      - name: Check backend types
        run: pnpm check

      - name: Check database migrations
        run: pnpm db:check

      - name: Test backend
        run: pnpm test

      - name: Check and build frontend
        working-directory: frontend
        run: pnpm build

      # A data reset rebuilds the schema after deploying, so it skips this step.
      - name: Apply D1 migrations
        if: env.RESET_DATA == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:migrate --remote .local/remote.json

      - name: Deploy Worker and frontend assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env "$DEPLOY_ENV"

      # Explicit reset only: drops D1 and R2, replays all migrations, and keeps the admin credential.
      - name: Reset production data to the demo set
        if: env.RESET_DATA == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm demo --remote .local/remote.json

      - name: Verify deployment
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            "$DEPLOY_URL/api/health" |
            jq --exit-status --arg environment "$DEPLOY_ENV" \
              '.data.status == "ok" and .data.environment == $environment and .data.database == "ok"'
          curl --fail --silent --show-error --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --output /dev/null "$DEPLOY_URL/"

      - name: Write deployment summary
        run: |
          {
            echo "### Deployment"
            echo "- Environment: $DEPLOY_ENV"
            echo "- Commit: $GITHUB_SHA"
            echo "- URL: $DEPLOY_URL"
            if [[ "$RESET_DATA" == true ]]; then
              echo "- Data: D1 and R2 reset to the demo data, admin credential kept"
            else
              echo "- D1: pending migrations applied, no demo reset"
            fi
            echo "- Verification: API health and frontend request passed"
          } >> "$GITHUB_STEP_SUMMARY"